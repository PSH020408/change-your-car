# Render Blueprint — free web service built from the repo's Dockerfile.
# Free plan: sleeps after 15 min idle; startup can take a minute or longer.
# Runtime caches and inference threads are bounded for the 512 MB instance.
services:
  - type: web
    name: change-your-car
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
