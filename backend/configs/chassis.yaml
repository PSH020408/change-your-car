# ---------------------------------------------------------------------------
# P1-5 — chassis and power-unit map, ground-effect era.
#
# FastF1 gives the TEAM per lap but never the chassis, and the chassis is what
# the simulator's docking screen selects. Team entries are renamed between
# seasons (Alfa Romeo -> Kick Sauber, AlphaTauri -> RB -> Racing Bulls), so
# every season carries its own block and each entry lists the aliases FastF1
# has actually used.
#
# This is DATA, not code: validate_coverage() in pipeline/ingest/metadata.py
# fails the run if a (season, team) pair appears in the laps and not here,
# rather than silently writing a null chassis into bronze.
# ---------------------------------------------------------------------------

2022:
  Red Bull Racing: {chassis: RB18,   pu: Red Bull Powertrains, aliases: [Red Bull, Oracle Red Bull Racing]}
  Ferrari:         {chassis: F1-75,  pu: Ferrari,              aliases: [Scuderia Ferrari]}
  Mercedes:        {chassis: W13,    pu: Mercedes,             aliases: [Mercedes-AMG Petronas]}
  Alpine:          {chassis: A522,   pu: Renault,              aliases: [Alpine F1 Team, BWT Alpine]}
  McLaren:         {chassis: MCL36,  pu: Mercedes,             aliases: []}
