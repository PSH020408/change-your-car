# Phase 1 pilot scope — validate the full pipeline on a small slice
# before expanding to the whole 2021-2025 ground-effect era.
#
# Selection rationale:
#   - 2023/2024 are stable regulation years with complete FastF1 coverage
#   - tracks chosen to span the aero-sensitivity spectrum:
#       Monza    = low downforce / drag-dominated
#       Silverstone = high-speed corner / downforce-dominated
#       Hungaroring = low-speed / mechanical-grip-dominated
#       Bahrain  = traction + tyre-thermal dominated
#       Spa      = mixed (long straights + high-speed corners)

pilot:
  seasons: [2023, 2024]
  events:
    - Bahrain Grand Prix
    - Monaco Grand Prix
    - Silverstone      # British Grand Prix
    - Hungaroring      # Hungarian Grand Prix
    - Monza            # Italian Grand Prix
  sessions: ["Q", "R"]     # Qualifying = clean-air reference, Race = degradation
  drivers: []              # empty = all classified drivers

full:
  seasons: [2021, 2022, 2023, 2024, 2025]
  events: []               # empty = all events in season
  sessions: ["FP2", "FP3", "Q", "R"]

telemetry:
  resample_by: distance    # distance | time
  step_m: 10.0             # uniform 10 m grid along the lap
  channels: [Speed, Throttle, Brake, nGear, RPM, DRS, X, Y]

lap_filters:
  drop_in_lap: true
  drop_out_lap: true
  drop_deleted: true
  max_pct_off_session_best: 1.07   # ignore laps >107% of session best
  exclude_track_status: ["4", "6", "7"]   # SC, VSC, VSC ending

segmentation:
  curvature_threshold_1pm: 0.0035   # 1/m; above this = corner
  min_segment_len_m: 40.0
  corner_speed_bins:                # km/h apex-speed classification
    low: [0, 120]
    medium: [120, 200]
    high: [200, 400]
  microsectors: 28
