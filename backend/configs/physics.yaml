# ---------------------------------------------------------------------------
# P3 — physics layer coefficients.
#
# Every slider in the HUD is normalised 0..1 with 0.5 = the real car's setup
# for that weekend (unknown to us, but embodied in the baseline telemetry).
# Every function returns a RELATIVE change against that baseline, so the
# layer never needs absolute aero numbers it cannot observe.
#
# GRADES (see claude/P3-SCOPE.md):
#   A  the ML learns it from data — the physics version here is only for
#      out-of-range extrapolation and the Engineering Log's "why"
#   B  physics formula, coefficient SIZE checked against our own data
#      (make physics-check prints the comparison)
#   C  literature value only, cannot be verified with public data —
#      small effect, wide uncertainty, declared as such in the HUD
#
# `u` is the relative uncertainty on the coefficient (0.5 = +-50%). The
# segment-delta layer evaluates every effect at (1-u) and (1+u) and reports
# the spread as the physics interval, next to the ML's own interval.
# ---------------------------------------------------------------------------

car:
  mass_dry_kg: 798            # 2023+ minimum incl. driver, no fuel (2022: 795/798)
  fuel_max_kg: 110
  # Speed at which downforce equals the car's weight. Sets how much of a
  # corner's grip is aero (v^2 / (v^2 + v0^2)). Fitted by physics-check #3.
  aero_crossover_kph: {value: 150.0, u: 0.20, grade: B}
  # Effective friction of the tyre on the road at zero aero load.
  mu_mechanical: {value: 1.60, u: 0.15, grade: B}

aero:
  # Full slider range (0 -> 1) changes total downforce / drag by this much.
  rear_wing:
    downforce_pct: {value: 10.0, u: 0.30, grade: B}
    drag_pct:      {value:  8.0, u: 0.30, grade: B}
    balance_pts:   {value: -3.0, u: 0.40, grade: C}   # more rear wing -> rear-biased
  front_wing:
    downforce_pct: {value:  7.0, u: 0.30, grade: B}
    drag_pct:      {value:  3.0, u: 0.40, grade: B}
    balance_pts:   {value: +3.0, u: 0.40, grade: C}   # more front wing -> front-biased
  # Top speed is drag-limited: v_max ~ (P / Cd)^(1/3). Straights are not all
  # at v_max, so the effect is scaled by how "terminal" the segment is.
  drag_to_topspeed_exponent: {value: 0.3333, u: 0.0, grade: B}

ground_effect:
  # Floor downforce rises as the car is lowered, then collapses when it
  # bottoms (plank contact / porpoising). Non-monotonic by design.
  downforce_pct_full_range: {value: 6.0, u: 0.50, grade: C}
  drag_per_downforce:       {value: 0.15, u: 0.50, grade: C}   # floor load is cheap drag
  bottoming_threshold:      {value: 0.25, u: 0.30, grade: C}   # slider value below which it stalls
  bottoming_penalty_pct:    {value: 12.0, u: 0.50, grade: C}   # lost at slider 0
  balance_pts_full_range:   {value: -2.0, u: 0.50, grade: C}   # lower = more rear load

suspension:
  # Softer = more mechanical grip on rough / kerbed tracks; stiffer = a
  # steadier aero platform on smooth tracks. Net effect is small either way.
  mech_grip_pct_full_range: {value: 2.0, u: 0.50, grade: C}
  aero_platform_pct_full_range: {value: 1.5, u: 0.50, grade: C}
  balance_pts_per_split:    {value: -4.0, u: 0.50, grade: C}   # stiffer front -> understeer
  default_roughness: 0.5    # per-circuit override in circuits.yaml (Monaco 0.9, Bahrain 0.3)

fuel:
  # Well-known paddock figure; physics-check #2 measures it from race laps.
  s_per_kg_per_lap: {value: 0.030, u: 0.25, grade: B}
  # How the lap penalty is shared between segment kinds (normalised by time).
  kind_weight: {straight: 0.8, kink: 1.0, low_speed_corner: 1.3,
                medium_speed_corner: 1.3, high_speed_corner: 1.2}

tyre:
  # Grade A: the ML learns compound / age / temperature from 254k rows. This
  # bell is used only when the user pushes temperature outside the data and
  # for the Engineering Log's explanation.
  window_c: {SOFT: 35.0, MEDIUM: 40.0, HARD: 45.0, INTERMEDIATE: 25.0, WET: 20.0}
  window_width_c: {value: 15.0, u: 0.30, grade: A}
  max_loss_pct:   {value:  6.0, u: 0.50, grade: A}
  deg_pct_per_lap: {SOFT: 0.10, MEDIUM: 0.06, HARD: 0.04, INTERMEDIATE: 0.08, WET: 0.05}

weather:
  # We train on dry laps only (scope.yaml conditions.train_on), so wet grip
  # cannot come from the ML. Literature multipliers, wide bands.
  grip_multiplier:
    dry:   {value: 1.00, u: 0.00, grade: A}
    # A -20% grip step is a ~10% corner-speed step, which on a corner-heavy
    # lap is the 5-8 s an intermediate lap actually loses to a dry one.
    inter: {value: 0.80, u: 0.08, grade: C}
    wet:   {value: 0.65, u: 0.12, grade: C}

balance:
  # Engineering Log thresholds on the [-1, 1] balance index.
  warn_understeer: -0.30
  warn_oversteer:  +0.30
  pts_to_index: 0.10        # 10 balance points = full scale
