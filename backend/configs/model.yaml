# ---------------------------------------------------------------------------
# P4 — ML delta model. Two levels (decision 2026-09-15, claude/PROJECT-STATE.md G):
#
#   level 1  segment_delta_s vs the SESSION reference        <- tyre, fuel, driver, chassis
#   level 2  session reference vs the CIRCUIT's best         <- temperature, session type, season
#
# The level-1 target is normalised per session, so anything constant within a
# session (track temperature, weather) cannot be learned there; level 2 is
# where it lives. Setup is NOT here at all — it is the physics layer (P3).
# ---------------------------------------------------------------------------

data:
  gold: ../data/gold/features.parquet
  train_conditions: [dry]
  effort_classes: [push, moderate]      # cruise laps are not what the HUD simulates
  gap_tolerance_s: 0.05                 # a segment with a telemetry hole has an understated time
  exclude_unstable_races: true          # physics-check #2: SC / red-flag races have no rhythm
  holdout_event: miami_grand_prix       # never touched by CV; the "unseen track" number
  # The gate population: what the HUD simulates. A push lap with nobody
  # within 2.5 s ahead at the line. Laps in traffic still TRAIN the model
  # (that is how it learns the gap feature); they are not what it is judged on.
  clean_air_gap_s: 2.5
  gate_effort: [push]

features:
  # Only things known BEFORE the lap is driven. Anything measured on the lap
  # itself (speeds, brake points, throttle, DRS, pace ratios, the lap time)
  # is an outcome and is refused by FeatureSpec — see dataset.LEAKAGE.
  # gap_ahead_s: seconds to the car that crossed the line just before this
  # lap started - traffic, known at the line. The HUD simulates clean air
  # (gap = 10 s); the model learns what dirty air costs from the race laps.
  # lap_session_progress: track evolution - where in the session the lap
  # started (0 first crossing, 1 last). Rubber goes down, the track speeds
  # up; a Q3 lap is not a Q1 lap. Known at the line.
  numeric: [tyre_life, lap_number, track_temp_c, air_temp_c, lap_effort_index, gap_ahead_s,
            lap_session_progress, segment_length_m, segment_min_radius_m, segment_reference_s]
  categorical: [segment_kind, session, compound, fresh_tyre, driver, chassis, season,
                segment_sector, segment_is_kink]

level1:
  backend: auto                          # lightgbm | xgboost | sklearn (auto = first available)
  quantiles: [0.1, 0.5, 0.9]
  n_folds: 5                             # GroupKFold on (season, event)
  params:
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 31                       # 63 leaves / 50 samples fitted per-lap noise: ridge beat it
    min_child_samples: 200
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0

level2:
  ridge_alpha: 1.0
  bootstrap: 200                         # over sessions -> coefficient intervals

acceptance:
  # The HUD never shows an absolute delta: it shows the CHANGE from a real
  # baseline lap when conditions change. So the lap gates are on the
  # counterfactual error - (y_lap - y_baseline) vs (p_lap - p_baseline) with
  # the driver's fastest lap of the session as baseline - which is the
  # quantity deployed. The absolute lap MAE is still printed; it carries
  # everything a lap has that no pre-lap feature can know (traffic, damage,
  # a management phase) and sums it over 28 segments.
  segment_mae_s: 0.15                    # per segment, out-of-group, q50
  # The original 0.30 s lap gate was written before anyone measured how much
  # two consecutive clean laps of the SAME driver on the SAME tyres differ:
  # that difference is driver execution and track noise, invisible to any
  # pre-lap feature, and it is the floor. Judged against it instead:
  # Counterfactual vs the driver's REPRESENTATIVE (median) clean push lap,
  # the HUD's default baseline. Against the FASTEST lap every error carries
  # that lap's own luck (the best of 20 draws), which no model can predict.
  lap_mae_vs_noise_floor: 1.25           # clean-air push counterfactual MAE <= 1.25 x consecutive-pair floor
  lap_skill_min: 0.35                    # ...and explains >= 35% of lap-to-lap change (1 - err / 'no change')
  unseen_track_lap_skill_min: 0.25       # holdout event: >= 25%
  coverage_80: [0.70, 0.90]              # after conformal calibration, on the holdout event
  beat_ridge: true                       # the GBM must beat the linear baseline on segment MAE
  monotonic:
    tyre_life_up_slower: true            # +5 laps on the tyre -> delta up
    lap_number_up_faster_in_race: true   # +10 race laps (fuel burnt) -> delta down

registry: ../data/artifacts/models
