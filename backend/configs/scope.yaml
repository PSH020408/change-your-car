# ---------------------------------------------------------------------------
# Data scope — Ground Effect ERA only.
#
# 2022 regulations introduced the ground-effect floor; 2026 replaced it again.
# 2021 cars are a DIFFERENT regulation era: including them would teach the
# model to average across two aero philosophies. Excluded by decision.
# ---------------------------------------------------------------------------

era:
  name: ground_effect
  seasons: [2022, 2023, 2024, 2025]

# What the background cache-warming job downloads.
# MEASURED (23-session ledger): FP ~52-74 MB, Q ~99 MB, R ~110 MB per session.
# Full era = 92 events / 21 sprint weekends = 460 sessions = ~36.9 GB.
# Decision D8: COLLECT EVERYTHING (re-downloading later costs rate-limited
# hours; disk is cheap), but TRAIN NARROW - see `train.sessions` below.
warm:
  seasons: [2022, 2023, 2024, 2025]
  sessions: ["FP1", "FP2", "FP3", "Q", "SQ", "S", "R"]
  load:
    laps: true
    telemetry: true
    weather: true
    messages: true

# What the reconnaissance survey inspects (small, fast, answers "what do we have")
recon:
  samples:
    - { season: 2022, event: "Bahrain Grand Prix",   session: "R" }
    - { season: 2022, event: "Monza",                session: "Q" }
    - { season: 2023, event: "Silverstone",          session: "Q" }
    - { season: 2023, event: "Hungaroring",          session: "R" }
    - { season: 2024, event: "Bahrain Grand Prix",   session: "Q" }
    - { season: 2024, event: "Monaco",               session: "R" }
    - { season: 2024, event: "Spa-Francorchamps",    session: "Q" }
    - { season: 2025, event: "Silverstone",          session: "R" }
    - { season: 2025, event: "Monza",                session: "Q" }
    - { season: 2025, event: "Bahrain Grand Prix",   session: "R" }

# What actually enters training (D8). Practice is downloaded but excluded:
# fuel loads are unknown, so fuel-corrected pace is unreliable. FP3 is the
# closest to qualifying trim and is the first expansion candidate (P8-6).
train:
  sessions: ["Q", "SQ", "R", "S"]
  expansion_candidates: ["FP3"]

# Modelling pilot — the slice P1-P5 are built and validated against
pilot:
  seasons: [2023, 2024]
  events:
    - Bahrain Grand Prix
    - Monaco
    - Silverstone
    - Hungaroring
    - Monza
  sessions: ["Q", "R"]

# ---------------------------------------------------------------------------
# Paths. The cache lives under backend/ because that is where the warm job
# created it; bronze/silver/gold stay at the repo root. Both are explicit so
# no code has to guess from a relative __file__ walk (see docs/recon/DECISIONS.md D9).
# ---------------------------------------------------------------------------
paths:
  cache_dir: data/cache        # relative to backend/
  lake_dir: ../data            # bronze / silver / gold / artifacts

# ---------------------------------------------------------------------------
# Telemetry. MEASURED: car data arrives at a fixed dt = 240 ms, so spatial
# spacing is purely a function of speed (4 m at 60 km/h, 20 m at 300 km/h).
# The original 10 m uniform grid would have interpolated on every straight.
# Decision D1: no uniform grid for features at all - segment-level integration
# on raw samples - and a 20 m grid ONLY for the HUD overlay, carrying an
# interpolation mask so the UI never claims resolution we do not have.
# ---------------------------------------------------------------------------
telemetry:
  feature_resampling: none     # integrate raw samples inside each segment
  display_step_m: 20.0         # HUD overlay grid = raw spacing at 300 km/h
  emit_interpolation_mask: true
  sample_dt_ms: 240            # measured, not assumed
  channels: [Speed, Throttle, Brake, nGear, RPM, DRS, X, Y]

# ---------------------------------------------------------------------------
# Lap filters. Order matters and is deliberate (D3, D4):
#   track status BEFORE the pace gate, so we can prove the status filter works
#   instead of assuming the pace gate already removed SC laps.
# Every step logs how many laps it removed.
# ---------------------------------------------------------------------------
lap_filters:
  log_each_step: true
  # REVISED AGAIN (D4, revision 2). Track status now runs FIRST.
  #
  # Running it fourth made it unanswerable: the 2022 Australian GP had three
  # caution periods (SC lap 2, SC lap 23, VSC lap 39) and the filter still
  # removed zero laps, because `require_accurate` had already taken 189 laps
  # ahead of it. Whether FastF1's IsAccurate reliably excludes caution laps in
  # EVERY session is not something to depend on silently.
  #
  # Track status is a pure property of the lap - it needs no telemetry and no
  # timing validity - so it belongs at the front, where its count is measured
  # against the whole session and means what it says.
  order:
    - exclude_track_status   # FIRST: operates on the full population
    - drop_pit_laps          # in / out laps
    - drop_deleted
    - require_accurate
    - max_telemetry_gap      # safety net only - see below
    - pace_gate              # conditions-relative (D3)

  # 4 SafetyCar, 5 RedFlag, 6 VSC, 7 VSC ending. Code 5 was missing from the
  # first version. Yellow (2) is deliberately NOT here - it is tagged instead
  # (`track_status_flag`), because dropping every yellow-sector lap costs ~20%
  # of a qualifying session and the lap is still real data.
  exclude_track_status: ["4", "5", "6", "7"]

  # D2 REVISED - measured, after the first threshold removed 88% of a session.
  #
  # The original gate was 40 m of distance. The measured distribution of each
  # lap's worst spacing had a MEDIAN of 67 m, so the threshold sat below the
  # middle of the data. The mistake was the axis, not just the number:
  # distance conflates "the feed dropped a sample" with "the car was fast",
  # since one skipped sample already spans 20 m at 300 km/h.
  #
  # MEASURED (2022 Australian GP R, 813 laps), worst gap per lap:
  #   p50 0.88 s   p90 1.20 s   p95 1.24 s   max 1.32 s   (nominal 0.24 s)
  #
  # The distribution is unimodal and tight: a ~3-sample dropout happens on the
  # MEDIAN lap. There is no clean-vs-broken split to threshold between, so any
  # value inside that range just discards a third of the session arbitrarily -
  # 1.0 s removed 294 of 813 laps. A filter that fires on the median lap is
  # not detecting a defect.
  #
  # So this is now a SAFETY NET, set outside the observed distribution to catch
  # genuinely broken laps in other sessions. The real signal is carried as the
  # `telemetry_quality` tag (clean / normal / gappy / holed) into bronze, and
  # P2 and P4 decide what they need - same principle as wet conditions and
  # yellow flags.
  max_telemetry_gap_s: 2.0
  quality_bands_s: {clean: 0.5, normal: 1.0, gappy: 1.5}

  # D3 - 107% of the SESSION BEST is invalid when grip changes mid-session
  # (2025 Silverstone R yielded 14.4% because of exactly this). Compare each
  # lap against a conditions-matched local reference instead.
  pace_gate:
    threshold_pct: 1.07
    reference: rolling_window      # rolling_window | session_best
    window_laps: 5                 # +/- laps around the lap under test
    reference_top_n: 3             # median of the N fastest laps in the window

# ---------------------------------------------------------------------------
# Conditions are TAGGED, never filtered away (D3). The dry model trains on
# dry only; wet/inter laps are kept for a later conditions model.
# ---------------------------------------------------------------------------
conditions:
  tag_field: condition           # dry | inter | wet
  inter_compounds: [INTERMEDIATE]
  wet_compounds: [WET]
  train_on: [dry]

# ---------------------------------------------------------------------------
# Setup proxies (D6). Real team setups are never published; these observable
# channels stand in for them. Null rates are measured, not guessed, so the
# imputation rule is part of the spec.
# ---------------------------------------------------------------------------
setup_proxies:
  primary_downforce: SpeedI2     # 0.2% null - cleanest channel in the lap table
  drag: SpeedST                  # 13.4% null
  drag_traction: SpeedFL         # 5.4% null
  secondary_downforce: SpeedI1   # 20.8% null
  impute_from: segment_max_speed # fill nulls from telemetry within that segment
  impute_flag_field: speed_trap_imputed   # let the model see that it was filled
  derived:
    - aero_balance: SpeedST / high_speed_corner_apex_speed
    - traction: low_speed_corner_exit_accel
    - braking_stability: decel_zone_length / entry_speed_squared

# ---------------------------------------------------------------------------
# P2 segmentation.
#
# Geometry is the ONE place resampling is legitimate: the racing line is a
# continuous spatial curve sampled unevenly only because speed varied, so
# interpolating it onto a uniform arc-length grid recovers the curve rather
# than inventing driving (contrast D1, which governs telemetry channels).
#
# curvature_threshold_1pm is NOT a constant to trust - 0.0035 means "a corner
# is anything tighter than a 286 m radius", which is a guess. `segment.run`
# prints a sweep of candidate thresholds against the resulting corner count;
# set this per circuit family by comparing with published corner counts, the
# same way the telemetry-gap threshold was settled.
# ---------------------------------------------------------------------------
segmentation:
  geometry_step_m: 10.0        # uniform arc-length grid for geometry only
  # CALIBRATED against a jittered circle of known radius and a 70 m hairpin.
  # 40 m / order 3 (the first guess) gave 16% curvature error at 0.5 m of
  # position jitter and 80% at 1.0 m; 90 m / order 2 holds under 1% across all
  # of them while still recovering a 70 m corner at full amplitude.
  smooth_window_m: 90.0        # local-fit window, in metres
  poly_order: 2                # quadratic resists noise; a cubic chases it
  max_lateral_g: 6.5           # curvature implying more than this is noise
  # A straight whose radius sits just under the corner threshold is the
  # boundary doing its job, not a lost corner. Only flag radii materially
  # tighter than the threshold (default: below 70% of it).
  hidden_corner_factor: 0.7
  # SETTLED from the sweep on 2022 Australian GP (published: 14 turns), after
  # the curvature fix:
  #     0.0015 (667 m, 1.1 g @300) -> 14 corners   == published
  #     0.0020 (500 m, 1.4 g)      -> 15
  #     0.0025 (400 m, 1.8 g)      -> 14 corners   == published
  #     0.0035 (286 m, 2.5 g)      -> 11           <- the old value, too few
  # Two candidates match the published count, so physics breaks the tie: a
  # 400 m radius is 1.8 g at 300 km/h, which is a corner a driver works at,
  # while 667 m is 1.1 g — a kink the car takes flat. Take the tighter one.
  curvature_threshold_1pm: 0.0025
  min_gap_m: 30.0              # close gaps this short (double-apex corners)
  min_segment_len_m: 40.0      # drop runs this short (curvature noise)
  corner_speed_bins:
    low: [0, 120]
    medium: [120, 200]
    high: [200, 400]
  microsectors: 28
