# Pirelli slick nominations per event: which C-compound was raced as SOFT / MEDIUM / HARD.
#
# FastF1 labels tyres SOFT/MEDIUM/HARD, but those labels point at a different rubber
# every weekend: Bahrain's SOFT is a C3, Monaco's is a C5. The ML's compound feature
# therefore mixes compounds two or three steps apart. This table turns the label into
# the hardness number Pirelli nominated (C1 = hardest ... C6 = softest, 2025+).
#
# Every row was taken from a Pirelli press release (race preview or batch nomination
# announcement) and cross-checked against formula1.com where available; the URL is
# the primary source. 92 events, 2022-2025, all confidence 'high'.
#
# Caveats, so nobody over-reads the number:
#   * The scale is re-based across seasons: Pirelli added a new hardest C1 for 2023
#     (2022's C1 is roughly 2023's C2) and a new softest C6 for 2025. Within a season the
#     numbers are comparable; across seasons the model also sees `season`.
#   * 2023 Hungary ran the Alternative Tyre Allocation experiment (C3/C4/C5).
#   * 2025 Belgium (C1/C3/C4), United States (C1/C3/C4) and Mexico City (C2/C4/C5) skip a
#     step; the SOFT->MEDIUM gap is two compounds there, which is exactly why a label is
#     not enough.
#   * 2025 Chinese GP: the SOFT (C4) was nominated but no one raced it.
#
# hardness = int(C-number). Used by pipeline/features (compound_hardness) and the API.

